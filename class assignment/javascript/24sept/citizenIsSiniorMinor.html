<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>age check</title>
</head>
<body>
    <script>
        let a=Number(prompt("enter age"));
        if(a<=10){
            document.write(a+ "age is minor")
        }else if(a<=50){
            document.write(a+ "age is major")
        }else{
            document.write(a+ "age is senior citizen")

        }
     
    </script>
</body>
</html>
