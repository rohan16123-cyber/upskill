<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>find largest num from 3 number</title>
</head>
<body>
    <script>
        let a=Number(prompt("enter num 1"));
        let b=Number(prompt("enter num 2"));
        let c=Number(prompt("enter num 3"));
        if(a==b==c){
            document.write("all num are equal");
        }else if(a>b && a>c){
            document.write(a+"is greater");
        }else if(b>a && b>c){
            document.write(b+"is greater");
        }else if(c>b && c>a){
            document.write(c+"is grsater");
        }
    </script>
    
</body>
</html>
