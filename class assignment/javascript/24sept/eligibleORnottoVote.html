<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eligible to vote or not</title>
</head>
<body>
    <script>
        let a=Number(prompt("enter age"));
        if(a>=18){
            document.write("eligible to vote");
        }else{
            document.write("not eligible to vote");
        }
    </script>
</body>
</html>
