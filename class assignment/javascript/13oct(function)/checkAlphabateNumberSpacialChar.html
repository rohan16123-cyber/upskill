<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>check alphabate or number or spacial character</title>
</head>
<body>
    <script>
        let char=prompt("enter")
        function check(){
            if(char>=9){
                document.write("is a number")
            }else if(char<+z){
                document.write("is a character")
            }else{
                document.write("is a spacial character")
            }
        }
        check();
    </script>
</body>
</html>
