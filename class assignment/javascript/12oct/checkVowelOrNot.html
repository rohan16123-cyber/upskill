<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cahracter is vowel or not</title>
</head>
<body>
    <script>
        let char=prompt("enter character");
        switch(true){
            case true:
                if(char=="a"|| char=="e" || char=="i" || char=="o" || char=="u"){
                    document.write(char+"<br> is vowel");
                }else{
                    document.write(char + "<br> is not a vowel");
                }
            break;
            
        }
    </script>
</body>
</html>
