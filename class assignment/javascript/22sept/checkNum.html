<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>number check single digit or not</title>
    <script>
        let a=Number(prompt("enter num"))
        if(a>-9 & a<=9){
            document.write("num is single digit")
       
        }else{
            document.write("num is muti digit")
        }
    </script>
