<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>even odd</title>
    <script>
        let a=Number(prompt("enter a number"))
        if(a%2===0){
            document.write("number is even")
        }else{
            document.write("number is odd")
        }
    </script>
