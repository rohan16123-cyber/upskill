<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Booking Form</title>
</head>
<body>
    <header>
        <h1>Flight Booking Form</h1>
    </header>
    <main>
        <form>
            name:<input type="text" name="txtname" placeholder="enter name">
            <br>
            last name:<input type="text" name="txtlastname" placeholder="enter last name">
            <br>
            gender:male<input type="radio" value="m" name="gender">
            female:<input type="radio" value="f" name="gender">
            <br>
            round trip:<input type="radio" name="select" value="trip">
            one way trip:<input type="radio" name="select" value="trip">
            <br>
            booking form date:<input type="date" name="date">
            to date:<input type="date" name="date">
            <br>
            departure from City
            <select>
                <option>mumbai</option>
                <option>goa</option>
                <option>pune</option>
            </select>
            arival city
            <select>
                <option>new york city</option>
                <option>Canada</option>
                <option>Dubai</option>
                <option>London</option>
            </select>
            <br>
            contact no:<input type="tel" maxlength="10">
            <br>
            Document provided:
            <select>
                <option>Aadhar</option>
                <option>PAN</option>
                <option>Passport</option>
            </select>
            <br>
            <button value="save">conform</button>
            <button value="clear">cancle</button>
        </form>
    </main>
</body>
</html>
