<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>time table</title>
</head>
<body>
    <table border="1" align="center" cellpadding="10" cellspacing="0">
        <tr>
            <td>Time</td>
            <td>Monday</td>
            <td>Tuesday</td>
            <td>Wednesday</td>
        </tr>
        <<tr>
            <td>9:00am-10:00am</td>
            <td>html</td>
            <td>css</td>
            <td>python</td>
        </tr>
        <tr>
            <td>10:00am-11:00am</td>
            <td>css</td>
            <td>js</td>
            <td>java</td>
        </tr>
        <tr>
            <td></td>
            <th colSpan="3">LUNCH</th>
        </tr>
        <tr>
            <td>12:00pm-1:00pm</td>
            <td>python</td>
            <td>html</td>
            <td>css</td>
    </table>
    <ul>
        <li type="circle">html</li>
        <li type="circle">css</li>
        <li type="circle">js</li>
        <li type="circle">python</li>
        <li type="circle">java</li>
    </ul>
    <ul>
        <li type="square">html</li>
        <li type="square">css</li>
        <li type="square">js</li>
        <li type="square">python</li>
        <li type="square">java</li>
    </ul>
    <ul>
        <li type="disc">html</li>
        <li type="disc">css</li>
        <li type="disc">js</li>
        <li type="disc">python</li>
        <li type="disc">java</li>
    </ul>
</body>
</html>
