<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout Webpage</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
        }

        /* Main Grid Container */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: auto 200px 300px auto;
            width: 800px;
            border: 2px solid #000;
            background-color: #fff;
        }

        /* Common styling for grid items */
        .grid-item {
            border: 1px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        /* Links Row */
        .link1 { grid-column: 1 / 2; grid-row: 1 / 2; }
        .link2 { grid-column: 2 / 3; grid-row: 1 / 2; }
        .link3 { grid-column: 3 / 4; grid-row: 1 / 2; }
        .link4 { grid-column: 4 / 5; grid-row: 1 / 2; }

        /* Images Row */
        .image1 {
            grid-column: 1 / 3;
            grid-row: 2 / 3;
            background-color: #eaeaea;
        }

        .image2 {
            grid-column: 3 / 5;
            grid-row: 2 / 3;
            background-color: #eaeaea;
        }

        /* Content Area */
        .content {
            grid-column: 1 / 5;
            grid-row: 3 / 4;
            background-color: #fafafa;
        }

        /* Footer */
        .footer {
            grid-column: 1 / 5;
            grid-row: 4 / 5;
            background-color: #f1f1f1;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <!-- Links -->
        <div class="grid-item link1"><a href="#">Link 1</a></div>
        <div class="grid-item link2"><a href="#">Link 2</a></div>
        <div class="grid-item link3"><a href="#">Link 3</a></div>
        <div class="grid-item link4"><a href="#">Link 4</a></div>

        <!-- Images -->
        <div class="grid-item image1">Image 1</div>
        <div class="grid-item image2">Image 2</div>

        <!-- Content -->
        <div class="grid-item content">content</div>

        <!-- Footer -->
        <div class="grid-item footer">Footer information</div>
    </div>

</body>
</html>
