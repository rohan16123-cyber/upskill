<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>assignment2</title>
    <style>
        section{
            background-color: brown;
            height: 300px;
            width: 800px;
            border-style: solid;
        }
        div{
            background-color: rgb(234, 234, 8);
            border-style: solid;
            text-align: center;
            height: 150px;
            width: 250px;
            margin: 50px;
        }
        .inner{
            background-color: beige;
            height: 70px;
            border-style: solid;
            width: 200px;
            margin: 30px;
        }

    </style>
</head>
<body>
    <main>
        <section>
            <div>
                <h5>example of css</h5>
                <p class="inner">
                    css is a style sheet 
                </p>
            </div>
        </section>
        <br>

        <section>
            <div>
                <h5>example of class selector</h5>
                <p class="inner">
                    class selector is used to select elements with a specific class attribute.
                </p>
            </div>
        </section>
    </main>
    
</body>
</html>
