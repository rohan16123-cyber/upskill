<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table from 1 to 10</title>
</head>
<body>
    <script>
        for(let i=1; i<=10; i++){
            for(let j=1; j<=10; j++){
              let d=i*j
                document.write(d+" ")
            }
            document.write("<br>")
        }
    </script>
</body>
</html>
