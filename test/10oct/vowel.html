<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test java script</title>
</head>
<body>
    <script>
        "use strict";  
        let a=(prompt("enter character"))
        if (a == "a" || a == "e" || a == "i" || a == "o" || a == "u") {
            document.write(a+"<br>is vowel")
        } else {
            document.write(a+"<br>is not vowel")
        }
    </script>
</body>
