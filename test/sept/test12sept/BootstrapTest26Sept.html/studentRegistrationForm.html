<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student Registration Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1 class="text-center">Student Registration Form</h1>
        <form class="p-2 align-content-center ">
            <div class="mb-3 col-md-8">
                <label for="name" class="form-control form-control-lg">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your name">
            </div>
            <div class="mb-3 col-md-8">
                <label for="email" class="form-control form-control-lg">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email">
            </div>
            <div class="mb-3 col-md-8">
                <label for="password" class="form-control form-control-lg">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your password">
            </div>
            <div class="mb-3 col-md-10">
                <label for="mobile" class="form-control form-control-lg">Mobile</label>
                <input type="text" class="form-control" id="mobile" placeholder="Enter your mobile number">
            </div>
            <div class="mb-3  col-md-4">
                <label for="gender" class="form-control d-flex form-control-lg">Gender</label>
                <select class="form-select" id="gender">
                    <option selected>Select your gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="mb-3 col-md-5 col-lg-4">
                <label for="course" class="form-control form-control-lg">Course</label>
                <select class="form-select form-check" id="course">
                    <option selected>Select a course</option>
                    <option value="1">Computer Science</option>
                    <option value="2">Mathematics</option>
                    <option value="3">Physics</option>
                    <option value="4">Chemistry</option>
                </select>
            </div>
            <div class="mb-3 col-md-8">
                <label for="address" class="form-control form-control-lg">Address</label>
                <textarea class="form-control" id="address" rows="3" placeholder="Enter your address"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
    </div>
</body>
</html>
