<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
          
          for(i=1; i<=20;i++){
            mul=0
            for(let j=1; j<=i; j++){
                mul=mul*j
                if(j%2==0){
                    document.write(j)
                    mul++
                }
            }  
             document.write("<br>")          
        }
    </script>
</body>
</html>
