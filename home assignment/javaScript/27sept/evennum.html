<!DOCTYPE html>
<html>
    <head>
        <title>Even Numbers</title>
    </head>
    <body>
        <script>
         let a=Number(prompt("enter num"))
         let b=Number(prompt("enter num"))
         for (i=a; i<=b; i++);{
            if(i%2==0){
                document.write(i)
            }
         }
        </script>
    </body>
