<!DOCTYPE html>
<html>
    <head>
        <title>Product Category Table</title>
    </head>
    <body>
        <table border="1" align="center" cellpadding="10">
            <tr>
                <td>Category</td>
                <td>Product name</td>
                <td>Price</td>
            </tr>
            <tr>
                <td rowspan="3">Eletronics</td>
                <td>mobile</td>
                <td>20000</td>
            </tr>
            <tr>
                <td>laptop</td>
                <td>50000</td>
            </tr>
            <tr>
                <td>tv</td>
                <td>30000</td>
            </tr>
           
            <tr>
                <td rowspan="2">clothing</td>
                <td>shirt</td>
                <td>1000</td>
            </tr>
            <tr>
                <td>jeans</td>
                <td>2000</td>
            </tr>
            <tr>
                <td>grosory</td>
                <td>rice</td>
                <td>1000</td>
            </tr>

        </table>

    </body>
</html>
