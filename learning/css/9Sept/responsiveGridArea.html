<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            .container{
                display: grid;
                grid-template-columns:repeat(3,1fr);
                gap: 5px;
                padding: 10px;
            }
            .innerBox{
                border: 4px solid black;
                background-color: antiquewhite;
            }
            @media(max-width:750px){
              .container{
                grid-template-columns: 1fr;
              }  

              .innerBox{
                background-color: aqua;
              }

            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="container">
            <div class="innerBox">
                <h1>This is example of responsive grid</h1>
            </div>
            <div class="innerBox">
                <h1>This is example of responsive grid</h1>
            </div>
            <div class="innerBox">
                <h1>This is example of responsive grid</h1>
            </div>
            <div class="innerBox">
                <h1>This is example of responsive grid</h1>
            </div>
        </div>
        </div>
    </body>
</html>
