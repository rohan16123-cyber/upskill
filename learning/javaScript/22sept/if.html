<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if else statement</title>
    <script>
        var a=Number(prompt("enter number"))
        if(a>0){
            document.write("number is positive")
        }else{
            document.write("number is not positive")
        }
    </script>
</head>

</body>
</html>
