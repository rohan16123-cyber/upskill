<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>while Loop</title>
</head>
<body>
    <script>
        n=Number(prompt("enter number"))
        let sum=0
        while(n>0){
           let r=n%10
           sum=sum+r
           n=parseInt(n/10)
        }
        document.write("sum of digits="+sum)

    </script>
</body>
</html>
