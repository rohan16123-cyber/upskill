<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let choice=prompt("1.Enter 1 for addition 2.Enter 2 for Subtraction 3.Enter 3 stop")
        let no1=Number(prompt("Enter number 1"));
        let no2=Number(prompt("Enter number 2"));
        switch(choice){
            case '1':
                document.write("<h2>Addition is"+(no1+no2))
            break;
            case '2':
                document.write("<h2>Subtraction is"+(no1-no2))
            break;
            default:
                document.write("<h2>Wrong choice")
        }
        let i=10
        while(i<10)
        {
            document.write("<h2>Value of i in while "+i)
            i++
        }
        do{
            document.write("<h2>Value of i in do-while "+i)
            i++
        }while(i<10);
        
    </script>
</body>
</html>
