<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redio options</title>
</head>
<body>
    <header>

    </header>
    <main>
        <form>
            Enter name <input type="text" name="textname" placeholder="Enter name">
             <br> 
             <br> 
             
            Gender female<input type="radio" name="gender" value="F">
            Gender male<input type="radio" name="gender" value="M">
            <br>
            <br>
            highest digree:
            <br>
            Graduate<input type="radio" name="digree" value="G">
            post graduate <input type="radio" name="digree" value="PG">
            phd <input type="radio" name="digree" value="PHD">
            <br>
            <br>
            Hobbies:
            <br>
            Reading<input type="checkbox" name="chkreading" value="rd" checked>
            sleeping<input type="checkbox" name="chkreading" value="sl">
            traveling<input type="checkbox" name="chkreading" value="re">
            <br> 
            <br>
            select city
            <select id="city">
                <option>sangli</option>
                <option>satara</option>
                <option>kolhapur</option>
            </select>
            <input type="range" min="10" max="100" step="5">100<br>
            select city
            <input list="state" id="st">
            <datalist id="state">
                <option value="maharastar"></option>
                <option value="mp"></option>
                <option value="up"></option>
                <option value="uttarakhand"></option>
            </datalist>
        
        </form>
    </main>
    
</body>
</html>
