<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input element</title>
</head>
<body>
    <form>
        Enter Name: <input type="text" name="txtusername" placeholder="enter youser name" maxlength="5">
        Enter Password: <input type="password" name="txtpwd" placeholder="enter your password">
        Enter phone: <input type="number" name="phonenumber" placeholder="9876543210">
        Date: <input type="date" name="txtdt">
        <input type="submit" value="save">
        <input type="reset" value="clear">
    </form>
    
</body>
</html>
